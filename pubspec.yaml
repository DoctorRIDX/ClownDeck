name: clowndeck
description: ClownDeck - DoctorRIDX Project
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

# Versi "any" = CI selalu memakai versi terbaru yang cocok dengan Flutter stable.
dependencies:
  flutter:
    sdk: flutter
  http: any
  battery_plus: any
  shared_preferences: any
  permission_handler: any

dev_dependencies:
  flutter_lints: any
  flutter_launcher_icons: any

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/banner.jpg

# Ikon APK: topi badut tampil penuh (foreground sudah diberi ruang aman, tidak terpotong)
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1F1F1F"
  adaptive_icon_foreground: "assets/icon_foreground.png"
